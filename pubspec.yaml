name: epitaka

description: "ePitaka - Tipitaka Reader in Multiple Languages"
publish_to: "none"
version: 1.0.3+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  scrollable_positioned_list: ^0.3.8
  selectable: ^0.6.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Database
  drift: ^2.25.1
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Storage for preferences
  shared_preferences: ^2.3.5

  # Networking & file handling
  http: ^1.6.0
  archive: ^4.0.0

  # TTS
  flutter_tts: ^4.2.5
  supertonic_flutter: ^2.0.0
  audioplayers: ^6.8.1
  dio: ^5.4.0

  # Utils
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  super_clipboard: ^0.9.1
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  permission_handler: ^11.3.1

  # HTML rendering
  flutter_html: ^3.0.0-beta.2

  # Markdown rendering for AI Q&A
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1

  # AI inferer
  flutter_onnxruntime: ^1.8.0
  flutter_widget_from_html: ^0.15.0

  # BPE tokenizer for HuggingFace tokenizer.json
  dart_sentencepiece_tokenizer: ^1.3.2

  # Fuzzy matching for @ mention heading suggestions
  ffuzzy: ^0.6.2

  # Vector search (sqlite-vec via pub — no manual .so/.dylib)
  sqlite_vector: ^1.0.0
  share_plus: ^12.0.2
  app_links: ^7.2.1

  # Color picker for settings & startup wizard
  flutter_colorpicker: ^1.1.0

  # URL launcher for help links
  url_launcher: ^6.3.1

  # Download progress notifications on Android
  flutter_local_notifications: ^18.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/fonts/
    - assets/models/

  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700

    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-VariableFont_wdth,wght.ttf

    - family: NotoSansTaiTham
      fonts:
        - asset: assets/fonts/NotoSansTaiTham-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTaiTham-Bold.ttf
          weight: 700

    - family: PaliSerifTaiLnTilok
      fonts:
        - asset: assets/fonts/Pali_SerifTaiLnTilok.ttf

    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/Pyidaungsu-Regular.ttf
        - asset: assets/fonts/Pyidaungsu-Bold.ttf
          weight: 700

    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao-Regular.ttf
        - asset: assets/fonts/NotoSansLao-Bold.ttf
          weight: 700

    - family: LaoPaliRegular
      fonts:
        - asset: assets/fonts/LaoPaliRegular.ttf

    - family: NotoSansBrahmi
      fonts:
        - asset: assets/fonts/NotoSansBrahmi-Regular.ttf

    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

    - family: NotoSansChakma
      fonts:
        - asset: assets/fonts/NotoSansChakma-Regular.ttf

dependency_overrides:
  # sqlite_vector requires sqlite3 ^3.0.0 but drift ^2.25.1
  # constrains it to ^2.4.6. Override to satisfy both.
  sqlite3: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
  android_notification_icon:
    image_path: "assets/logo_mono.png"
    name: "mic_notification" 