name: Build Multi-Platform (Android, iOS, Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch: # Allows manual run from GitHub UI
    inputs:
      build_android:
        description: 'Build Android (APK + AAB)'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS (requires macOS runner + signing setup)'
        type: boolean
        default: false
      build_windows:
        description: 'Build Windows (x64)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux (x64)'
        type: boolean
        default: true

jobs:
  build-android:
    name: Build Android
    if: github.event_name == 'push' || github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Download core DBs (epitaka, dpd-dictionary) into asset pack
        run: |
          # URLs come from the checked-out translations manifest (single source of truth)
          EPITAKA_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['epitaka']['url'])")
          DPD_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['dpd_dictionary']['url'])")

          mkdir -p android/packs/core_db/src/main/assets

          echo "Downloading $EPITAKA_URL"
          curl -fL -o /tmp/epitaka.zip "$EPITAKA_URL"
          echo "Downloading $DPD_URL"
          curl -fL -o /tmp/dpd.zip "$DPD_URL"

          unzip -o /tmp/epitaka.zip -d /tmp/epitaka_x
          unzip -o /tmp/dpd.zip -d /tmp/dpd_x

          find /tmp/epitaka_x -name '*.db' -exec cp {} android/packs/core_db/src/main/assets/ \;
          find /tmp/dpd_x -name '*.db' -exec cp {} android/packs/core_db/src/main/assets/ \;
          ls -la android/packs/core_db/src/main/assets/

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
  # -------------------------------------------------------------
  # 2. iOS BUILD
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS
    if: github.event_name == 'push' || github.event.inputs.build_ios == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Create iOS Platform Files (if missing)
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ]; then
            flutter create --platforms=ios .
          fi

      - name: Ensure assets/db directory exists
        run: mkdir -p assets/db

      - name: Build iOS Release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Artifact (app)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app

  # -------------------------------------------------------------
  # 3. WINDOWS BUILD
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust (required by super_native_extensions)
        run: rustup default stable

      - name: Ensure Windows AppData directory exists
        shell: pwsh
        run: |
          Write-Host "USERPROFILE = $env:USERPROFILE"
          Write-Host "APPDATA = $env:APPDATA"
          Write-Host "LOCALAPPDATA = $env:LOCALAPPDATA"

          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null

          Get-Item $env:APPDATA
          Get-Item $env:LOCALAPPDATA
      - name: Create Windows Platform Files
        # windows/ directory checked into git so this is a no-op fallback
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install ImageMagick (icon conversion)
        shell: pwsh
        run: choco install imagemagick -y --no-progress --no-color

      - name: Generate Windows app icon from logo
        shell: pwsh
        run: |
          # Replace the default Flutter icon with the app logo (multi-size .ico)
          magick convert assets/icon.png -define icon:auto-resize=16,32,48,64,128,256 windows/runner/resources/app_icon.ico
          Get-ChildItem windows/runner/resources

      - name: Download core DBs (epitaka, dpd-dictionary) from latest release
        shell: pwsh
        run: |
          # URLs come from the checked-out translations manifest (single source of truth)
          $manifest = Get-Content -Raw assets/translations_manifest.json | ConvertFrom-Json
          $epitakaUrl = $manifest.core.epitaka.url
          $dpdUrl = $manifest.core.dpd_dictionary.url

          New-Item -ItemType Directory -Force -Path assets/db | Out-Null

          Write-Host "Downloading $epitakaUrl"
          curl.exe -fL -o epitaka.zip $epitakaUrl
          Write-Host "Downloading $dpdUrl"
          curl.exe -fL -o dpd.zip $dpdUrl

          Expand-Archive -Force -Path epitaka.zip -DestinationPath epitaka_x
          Expand-Archive -Force -Path dpd.zip -DestinationPath dpd_x

          Get-ChildItem -Path epitaka_x -Recurse -Filter *.db | Copy-Item -Destination assets/db -Force
          Get-ChildItem -Path dpd_x -Recurse -Filter *.db | Copy-Item -Destination assets/db -Force

          Remove-Item epitaka.zip, dpd.zip, epitaka_x, dpd_x -Recurse -Force
          Get-ChildItem assets/db

      - name: Diagnose Windows paths
        shell: pwsh
        run: |
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "APPDATA=$env:APPDATA"
          Write-Host "LOCALAPPDATA=$env:LOCALAPPDATA"
          Write-Host "TEMP=$env:TEMP"
          Write-Host "TMP=$env:TMP"

          Test-Path $env:USERPROFILE
          Test-Path $env:APPDATA
          Test-Path $env:LOCALAPPDATA

          Get-ChildItem "C:\Users\runneradmin" -Force

      - name: Build Windows Release
        shell: pwsh
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

      - name: Compress Windows Output
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\epitaka-windows-x64.zip

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress --no-color

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          # Run from the script dir so OutFile lands at install/windows/ deterministically
          pushd install/windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$env:GITHUB_REF_NAME" epitaka.nsi
          popd
          Get-ChildItem install/windows/epitaka-windows-x64-setup.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: install/windows/epitaka-windows-x64-setup.exe

  # -------------------------------------------------------------
  # 4. MACOS BUILD
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS
    if: github.event_name == 'push' || github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create macOS Platform Files (if not in git)
        run: |
          if [ ! -d "macos/Runner.xcodeproj" ]; then
            flutter create --platforms=macos .
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Download core DBs (epitaka, dpd-dictionary) from latest release
        run: |
          # URLs come from the checked-out translations manifest (single source of truth)
          EPITAKA_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['epitaka']['url'])")
          DPD_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['dpd_dictionary']['url'])")

          mkdir -p assets/db

          echo "Downloading $EPITAKA_URL"
          curl -fL -o /tmp/epitaka.zip "$EPITAKA_URL"
          echo "Downloading $DPD_URL"
          curl -fL -o /tmp/dpd.zip "$DPD_URL"

          unzip -o /tmp/epitaka.zip -d /tmp/epitaka_x
          unzip -o /tmp/dpd.zip -d /tmp/dpd_x

          find /tmp/epitaka_x -name '*.db' -exec cp {} assets/db/ \;
          find /tmp/dpd_x -name '*.db' -exec cp {} assets/db/ \;
          ls -la assets/db/

      - name: Sync CocoaPods (flutter_onnxruntime 1.8.3 needs ONNX Runtime 1.23.0)
        # The committed macos/Podfile.lock still pins onnxruntime-objc 1.24.2
        # (from the old flutter_onnxruntime 1.8.0 podspec). The 1.8.3 podspec
        # requires 1.23.0, and a plain `pod install` would fail on the version
        # mismatch. `--repo-update` refreshes the specs so CocoaPods can
        # resolve 1.23.0 and rewrite macos/Podfile.lock before the build.
        run: |
          cd macos
          pod install --repo-update
          cd ..

      - name: Build macOS Release
        # `flutter build macos --release` already produces a UNIVERSAL binary
        # (x86_64 + arm64) by default — the Flutter tool passes the generic
        # 'platform=macOS' destination for release builds, which builds both
        # architectures. There is no --target-platform option for macos.
        run: flutter build macos --release

      - name: Build DMG Installer
        run: |
          set -e
          APP_DIR="build/macos/Build/Products/Release/epitaka.app"
          STAGE="build/macos/dmg_stage"
          TMP_DMG="build/macos/epitaka-tmp.dmg"
          DMG="build/macos/epitaka-macos.dmg"
          ICONSET="build/macos/icon.iconset"

          # The app is already ad-hoc signed by flutter build (CODE_SIGN_IDENTITY="-")
          # and carries the custom icon from the asset catalog. Do NOT modify
          # the bundle after the build — touching Info.plist/resources would
          # invalidate the signature and Gatekeeper would report the app as
          # "damaged" (the old codesign --force --deep re-sign is deprecated
          # and unreliable on modern macOS). Verify the signature instead.
          echo "Verifying ad-hoc signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          # Volume icon for the DMG only (does not touch the .app bundle)
          mkdir -p "$ICONSET"
          sips -z 16 16 assets/icon.png --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 assets/icon.png --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 assets/icon.png --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 assets/icon.png --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 assets/icon.png --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 assets/icon.png --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 assets/icon.png --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 assets/icon.png --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 assets/icon.png --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 assets/icon.png --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o build/macos/epitaka.icns

          # Stage the app + one-click installer + instructions
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_DIR" "$STAGE/"

          # One-click launcher: installs to /Applications and clears the
          # Gatekeeper quarantine so the app opens without any certificate.
          # NOTE: heredoc body + EOF marker must be indented (10 spaces) so
          # they stay inside the YAML block scalar; YAML de-indents them back
          # to column 0 for bash.
          cat > "$STAGE/Install Epitaka.command" <<'EOF'
          #!/bin/bash
          # Installs epitaka.app into /Applications and clears the Gatekeeper
          # quarantine flag so it can be opened (no Apple Developer cert needed).
          SRC="$(cd "$(dirname "$0")" && pwd)"
          APP="/Applications/epitaka.app"
          rm -rf "$APP"
          ditto "$SRC/epitaka.app" "$APP"
          xattr -dr com.apple.quarantine "$APP" 2>/dev/null || true
          open "$APP"
          EOF
          chmod +x "$STAGE/Install Epitaka.command"

          cat > "$STAGE/README - How to Open.txt" <<'EOF'
          Epitaka is a community build and is NOT notarized (no Apple Developer
          certificate is used), so macOS Gatekeeper will block the first launch.

          EASIEST - ONE CLICK:
            Double-click "Install Epitaka.command" in this window. It installs the
            app into /Applications and clears the quarantine flag automatically.

          MANUAL:
            1. Drag epitaka.app into your Applications folder.
            2. Right-click (Control-click) epitaka.app and choose "Open", then
               click "Open" again in the confirmation dialog.
               On macOS 15 Sequoia this bypass was removed - instead open
               System Settings > Privacy & Security, scroll to the bottom and
               click "Open Anyway".
            3. Or clear the quarantine flag once in Terminal:
                 xattr -dr com.apple.quarantine /Applications/epitaka.app
          EOF

          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "epitaka" -srcfolder "$STAGE" -ov -format UDRW "$TMP_DMG"

          # Set the DMG volume icon, then compress
          DEVICE=$(hdiutil attach -nobrowse "$TMP_DMG" | awk '/\/dev\/disk/{print $1; exit}')
          cp build/macos/epitaka.icns "/Volumes/epitaka/.VolumeIcon.icns"
          SetFile -a C "/Volumes/epitaka"
          hdiutil detach "$DEVICE"
          hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG"
          rm -f "$TMP_DMG"
          ls -la "$DMG"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/epitaka-macos.dmg # ONLY upload the DMG

  # -------------------------------------------------------------
  # 5. LINUX BUILD
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev build-essential \
            libasound2-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
        # run: |
        #   sudo apt-get update
        #   sudo apt-get install -y \
        #     clang cmake ninja-build pkg-config \
        #     patchelf file libgtk-3-bin \
        #     libgtk-3-dev libglib2.0-dev \
        #     liblzma-dev libstdc++-12-dev \
        #     libasound2-dev libgstreamer-plugins-base1.0-dev \
        #     libgstreamer1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Linux Platform Files
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux .
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Download core DBs (epitaka, dpd-dictionary) from latest release
        run: |
          EPITAKA_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['epitaka']['url'])")
          DPD_URL=$(python3 -c "import json;print(json.load(open('assets/translations_manifest.json'))['core']['dpd_dictionary']['url'])")

          mkdir -p assets/db

          echo "Downloading $EPITAKA_URL"
          curl -fL -o /tmp/epitaka.zip "$EPITAKA_URL"
          echo "Downloading $DPD_URL"
          curl -fL -o /tmp/dpd.zip "$DPD_URL"

          unzip -o /tmp/epitaka.zip -d /tmp/epitaka_x
          unzip -o /tmp/dpd.zip -d /tmp/dpd_x

          find /tmp/epitaka_x -name '*.db' -exec cp {} assets/db/ \;
          find /tmp/dpd_x -name '*.db' -exec cp {} assets/db/ \;
          ls -la assets/db/

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Build Linux AppImage
        run: |
          set -e
          cd build/linux/x64/release/bundle

          # Download linuxdeploy and its GTK + AppImage plugins
          wget -S --show-progress -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Assemble AppDir — keep exe, lib (RPATH $ORIGIN/lib) and data together
          mkdir -p AppDir/usr/bin
          cp epitaka AppDir/usr/bin/
          cp -r lib AppDir/usr/bin/lib
          cp -r data AppDir/usr/bin/data

          # Desktop entry + icon
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp "$GITHUB_WORKSPACE/install/linux/epitaka.desktop" AppDir/usr/share/applications/
          cp "$GITHUB_WORKSPACE/assets/icon.png" AppDir/usr/share/icons/hicolor/512x512/apps/epitaka.png

          # Extract-and-run avoids the FUSE requirement on the runner.
          # Plugins are discovered via PATH (not cwd) when extracted, so
          # add the current directory to PATH before invoking linuxdeploy.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export VERSION="${GITHUB_REF_NAME}"
          export ARCH=x86_64
          export PATH="$PWD:$PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

          APPIMAGE=$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n 1)
          mv "$APPIMAGE" "$GITHUB_WORKSPACE/epitaka-linux-x64.AppImage"
          ls -la "$GITHUB_WORKSPACE/epitaka-linux-x64.AppImage"

      - name: Compress Linux Output
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../epitaka-linux-x64.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            epitaka-linux-x64.AppImage
            epitaka-linux-x64.tar.gz


  # -------------------------------------------------------------
  # 6. PUBLISH RELEASE (ONLY RUNS ON TAGS)
  # -------------------------------------------------------------
  publish-release:
    name: Publish Release
    # Runs after all build jobs finish, but publishes whatever artifacts
    # were actually produced — a failed platform build does not block the
    # release (if: always()). softprops/action-gh-release skips globs that
    # match no files by default (fail_on_unmatched_files: false), so only
    # the successfully built files are attached.
    needs: [build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-release/*.apk
            android-release/*.aab
            windows-release/*.exe
            macos-release/*.dmg
            linux-release/*.AppImage
            linux-release/*.tar.gz
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
