name: Build Multi-Platform (Android, Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  # -------------------------------------------------------------
  # 1. ANDROID BUILD
  # -------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android AAB & APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------
  # 2. WINDOWS BUILD
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ADD THIS STEP BEFORE PUB GET
      - name: Create Windows Platform Files
        run: flutter create --platforms=windows .

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Output
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\epitaka-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/epitaka-windows-x64.zip

# -------------------------------------------------------------
  # 3. MACOS BUILD
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create macOS Platform Files (if not in git)
        run: flutter create --platforms=macos .

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ADD THIS: Ensure CocoaPods dependency repo is updated & Pods installed
      - name: Install CocoaPods
        run: |
          cd macos
          pod install --repo-update

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Output
        run: |
          cd build/macos/Build/Products/Release
          zip -r epitaka-macos.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/epitaka-macos.zip

  # -------------------------------------------------------------
  # 4. LINUX BUILD
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ADD THIS STEP BEFORE PUB GET
      - name: Create Linux Platform Files
        run: flutter create --platforms=linux .

      - name: Install Dependencies
        run: flutter pub get

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Compress Linux Output
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../epitaka-linux-x64.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: epitaka-linux-x64.tar.gz
